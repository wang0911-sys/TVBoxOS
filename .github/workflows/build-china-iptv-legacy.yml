name: Build China IPTV Legacy Android 4.4 APK
on:
  push:
    branches: [main]
    paths:
      - 'china-iptv/android/patch_legacy.py'
      - '.github/workflows/build-china-iptv-legacy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  oldbox:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"
          log-accepted-android-sdk-licenses: false
      - name: Customize source for old Android TV boxes
        run: |
          python3 china-iptv/android/patch_legacy.py
          chmod +x gradlew
      - name: Build API19 32-bit APK
        run: |
          ./gradlew :app:assembleJava32Debug --no-daemon --stacktrace
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -print
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/China-IPTV-Legacy-Android4.apk
          sha256sum artifacts/China-IPTV-Legacy-Android4.apk > artifacts/SHA256.txt
      - name: Verify Android 4.4 support and APK signatures
        run: |
          APK=artifacts/China-IPTV-Legacy-Android4.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          "$SDK/build-tools/33.0.2/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"
          "$SDK/build-tools/33.0.2/zipalign" -c -v 4 "$APK"
          "$SDK/build-tools/33.0.2/apksigner" verify --verbose --min-sdk-version 19 "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: China-IPTV-Legacy-Android4
          path: artifacts/*
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: china-iptv-legacy-android4-v1
          name: 中国 IPTV · 旧盒兼容版 Android 4.4+
          prerelease: true
          files: artifacts/China-IPTV-Legacy-Android4.apk
          fail_on_unmatched_files: true
          body: |
            For older Android 4.4+ ARM set-top boxes.
            Uses the user's TVBoxOS source, NOT the Tian Guang Yun Ying TV Live base.
            Default remote source: https://raw.githubusercontent.com/wang0911-sys/TVBoxOS/main/china-iptv/live.txt
            Built with temporary debug signing; future builds may require uninstall.

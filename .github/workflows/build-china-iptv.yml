name: China IPTV Android Build
on:
  push:
    branches: [main]
    paths:
      - 'china-iptv/android/**'
      - '.github/workflows/build-china-iptv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout player source
        run: |
          git clone --depth 1 --branch beta https://github.com/sakana164/mytv_android.git app_source
          cd app_source
          git fetch --depth 1 origin fc78a7f392f1552826c0bb2b06c8a817a4dd16ef
          git checkout --detach fc78a7f392f1552826c0bb2b06c8a817a4dd16ef
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Patch China IPTV
        run: |
          cd app_source
          python3 ../china-iptv/android/patch_china.py
          chmod +x gradlew
      - name: Prepare temporary APK signing
        run: |
          PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -v -keystore "$GITHUB_WORKSPACE/china-sign.jks" -alias china -storepass "$PASSWORD" -keypass "$PASSWORD" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=China Community TV,O=Community,C=CN"
          echo "KEYSTORE=$GITHUB_WORKSPACE/china-sign.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=china" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Compile universal Android APK
        working-directory: app_source
        env:
          VERSION_CODE: '2'
        run: |
          ./gradlew :tv:assembleOriginalDebug --no-daemon --stacktrace
          mkdir -p ../artifacts
          APK="$(find tv/build/outputs/apk/original/debug -type f -name '*all*.apk' | head -n 1)"
          if [ -z "$APK" ]; then APK="$(find tv/build/outputs/apk/original/debug -type f -name '*.apk' | head -n 1)"; fi
          test -n "$APK"
          cp "$APK" ../artifacts/China-IPTV-Wuhan-Fixed.apk
          sha256sum ../artifacts/China-IPTV-Wuhan.apk > ../artifacts/SHA256.txt
      - name: Verify minimum SDK, APK alignment and signatures
        run: |
          APK="artifacts/China-IPTV-Wuhan-Fixed.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          "$SDK/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 21 "$APK"
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: China-IPTV-Wuhan-Fixed-APK
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error
      - name: Add APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: china-iptv-wuhan-v2
          name: 中国 IPTV · 武汉联通 v2（兼容修正版）
          prerelease: true
          files: artifacts/China-IPTV-Wuhan.apk
          fail_on_unmatched_files: true

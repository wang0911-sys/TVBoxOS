name: China IPTV Android Build
on:
  push:
    branches: [main]
    paths:
      - 'china-iptv/android/**'
      - '.github/workflows/build-china-iptv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout player source
        run: |
          git clone --depth 1 --branch beta https://github.com/sakana164/mytv_android.git app_source
          cd app_source
          git fetch --depth 1 origin fc78a7f392f1552826c0bb2b06c8a817a4dd16ef
          git checkout --detach fc78a7f392f1552826c0bb2b06c8a817a4dd16ef
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Patch China IPTV
        run: |
          cd app_source
          python3 ../china-iptv/android/patch_china.py
          chmod +x gradlew
